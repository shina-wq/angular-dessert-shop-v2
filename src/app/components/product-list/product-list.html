<section>
  <header>
    <h1>Desserts</h1>

    <div class="controls">
      <label class="visually-hidden" for="product-search">Search desserts</label>
      <input
        #search
        id="product-search"
        type="search"
        placeholder="Search desserts"
        [value]="query()"
        (input)="query.set(search.value)"
      />

      <label class="visually-hidden" for="product-sort">Sort desserts</label>
      <select #sorter id="product-sort" (change)="setSort(sorter.value)">
        @for (option of sortOptions; track option.value) {
          <option [value]="option.value" [selected]="option.value === sort()">
            {{ option.label }}
          </option>
        }
      </select>
    </div>
  </header>

  <div class="grid">
    @for (product of products(); track product.name) {
      <app-product-card
        [product]="product"
        [quantity]="cart.quantityOf(product)"
        (add)="cart.add(product)"
        (increment)="cart.increment(product)"
        (decrement)="cart.decrement(product)"
      />
    } @empty {
      <p class="empty">
        @if (query()) {
          No desserts match “{{ query() }}”.
        } @else {
          No desserts available right now. Please check back later.
        }
      </p>
    }
  </div>
</section>
