<section>
  <h1>Desserts</h1>

  <div class="grid">
    @for (product of products; track product.name) {
      <app-product-card
        [product]="product"
        [quantity]="cart.quantityOf(product)"
        (add)="cart.add(product)"
        (increment)="cart.increment(product)"
        (decrement)="cart.decrement(product)"
      />
    } @empty {
      <p class="empty">No desserts available right now. Please check back later.</p>
    }
  </div>
</section>
